        <a class="nav-link active" aria-current="page" href="indexA1.html">Usuarios</a>
        <a class="nav-link active" aria-current="page" href="10_Estadisticas.html">Estadísticas</a> <!--vincular al html que corresponda-->
        <a class="nav-link active" aria-current="page" href="11_AgregarPelicula.html">Agregar Película</a> <!--vincular al html que corresponda-->

      </div>
    </div>
  </div>
</nav>

<div class="container my-5" style="max-width: 900px;">
        
        <a href="indexA1.html#usuarios" class="cine-subtitulo text-decoration-none d-inline-block mb-3">
            <span style="font-size: 1.1rem;">‹</span> Volver a usuarios
        </a>

        
        <div class="mb-4">
            <h1 class="cine-titulo">Editar usuario</h1>
            <p class="cine-subtitulo">Modifica la información de la cuenta.</p>
        </div>

        
        <div class="cine-tarjeta-contenedor">
            
            
            <div class="d-flex align-items-center mb-4">
                <div class="cine-avatar me-3" style="width: 55px; height: 55px; font-size: 1.25rem;">
                    G
                </div>
                <div>
                    <div class="cine-usuario-nombre fs-5">Giovanni de Jesús</div>
                    <div class="cine-subtitulo" style="font-size: 0.85rem;">TeposHOT@gmail.com</div>
                </div>
            </div>

            <!-- formulario -->
            <form>
                <div class="row mb-3">
                   <!-- nombre completo -->
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label class="form-label cine-subtitulo mb-1 fw-bold" style="font-size: 0.85rem;">Nombre completo</label>
                        <input type="text" class="form-control cine-input-editar" value="Giovanni de Jesús">
                    </div>
                <!-- correo electrónico -->
                    <div class="col-md-6">
                        <label class="form-label cine-subtitulo mb-1 fw-bold" style="font-size: 0.85rem;">Correo electrónico</label>
                        <input type="email" class="form-control cine-input-editar" value="TeposHOT@gmail.com">
                    </div>
                </div>

                <div class="row mb-4">
                   <!-- nueva contraseña -->
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label class="form-label cine-subtitulo mb-1 fw-bold" style="font-size: 0.85rem;">Nueva contraseña</label>
                        <input type="password" class="form-control cine-input-editar" placeholder="Dejar vacío para no cambiar">
                    </div>
                <!-- confirmar contraseña -->
                    <div class="col-md-6">
                        <label class="form-label cine-subtitulo mb-1 fw-bold" style="font-size: 0.85rem;">Confirmar contraseña</label>
                        <input type="password" class="form-control cine-input-editar " placeholder="Repite la contraseña">
                    </div>
                </div>

             <!-- Botones de acción -->
                <div class="d-flex justify-content-end gap-3 pt-2">
                    <a href="indexA1.html" class="btn cine-btn-cancelar px-4 py-2">Cancelar</a>
                    <button type="submit" class="btn cine-btn-guardar px-4 py-2">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>


<footer class="cine-footer">
      <div class="container ">
        <p class="mb-0">Cine<span style="color: var(--color-boton-hover);">Polito</span> 2026 — Jose de Jesus Nicasio Torres</p>
