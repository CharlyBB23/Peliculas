<div class="container py-5">
    <div class="mb-4">
        <h2 class="fw-bold mb-1">Agregar película</h2>
        <p class="text-secondary small mb-0">Registra una nueva película en el catálogo.</p>
    </div>
    <div class="row g-4">
        <div class="col-12 col-md-4">
            <label class="form-label text-secondary small fw-bold">Póster</label>
            <div class="caja-imagen p-4">
                <span class="small">Arrastrar imagen película</span>
            </div>
        </div>
        <div class="col-12 col-md-8">
            <div class="card-form p-4">
                <div class="mb-3">
                    <label class="form-label small text-secondary">Título</label>
                    <input type="text" class="form-control campo" placeholder="Ej. Dune: Parte Dos">
                </div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label small text-secondary">Año</label>
                        <input type="text" class="form-control campo" placeholder="2024">
                    </div>
                    <div class="col-6">
                        <label class="form-label small text-secondary">Duración</label>
                        <input type="text" class="form-control campo" placeholder="2h 46m">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label small text-secondary">Género</label>
                        <select class="form-select campo">
                            <option selected>Ciencia ficción</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label small text-secondary">Director</label>
                        <input type="text" class="form-control campo" placeholder="Nombre del director">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary">Reparto (nombres separados por coma)</label>
                    <input type="text" class="form-control campo" placeholder="Timothée Chalamet, Zendaya, ...">
                </div>
                <div class="mb-4">
                    <label class="form-label small text-secondary">Sinopsis</label>
                    <textarea class="form-control campo" rows="3" placeholder="Escribe una breve sinopsis..."></textarea>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <button class="btn btn-regresar px-4 py-2">Cancelar</button>
                    <button class="btn btn-enviar px-4 py-2">Agregar película</button>
                </div>
            </div>
        </div>
    </div>
</div>
