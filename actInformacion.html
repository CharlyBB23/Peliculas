<main class="container my-3">
  <div class="mb-4">
    <a href="06_perfil.html" class="enlace-volver">Volver al perfil</a>
    <h1 class="titulo-form mt-2" >Mis datos</h1>
  </div>

  <div class="row g-4">

    <div class="col-12 col-md-4">
      <div class="tarjeta-perfil text-center d-flex flex-column align-items-center justify-content-center h-100">
        <div class="circulo-imagen"><i class="bi bi-person-fill"></i></div>
        <h4 class="titulo-secunadrio mb-1">Usuario123</h4>
        <p class="info-secundaria small mb-4">userGiovanni@gmail.com</p>
        <button type="button" class="btn btn-gris btn-sm">Cambiar foto</button>
      </div>
    </div>

  <div class="col-12 col-md-8">
    <div class="tarjeta-perfil">
      <form action="06_perfil.html">
        <h5 class="titulo-form  mb-3">Información personal</h5>

          <div class="row g-3 mb-4">
              <div class="col-12 col-md-6">
                <label class="form-label etiquetas">Nombre de usuario</label>
                <input type="text" class="form-control entrada-datos" value="Usuario123">
              </div>
              
              <div class="col-12 col-md-6">
                <label class="form-label etiquetas">Nombre completo</label>
                <input type="text" class="form-control entrada-datos" value="Giovanni de Jesús">
              </div>

              <div class="col-12">
                <label class="form-label etiquetas">Correo electrónico</label>
                <input type="email" class="form-control entrada-datos" value="TeposOG@gmail.com">
              </div>
            </div>

            <h5 class="titulo-form mb-3">Cambiar contraseña</h5>

            <div class="row g-3 mb-4">
              <div class="col-12">
                <label class="form-label etiquetas">Contraseña actual</label>
                <input type="password" class="form-control entrada-datos" placeholder="Ingresa tu contraseña actual">
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label etiquetas">Nueva contraseña</label>
                <input type="password" class="form-control entrada-datos" placeholder="Nueva contraseña">
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label etiquetas">Confirmar contraseña</label>
                <input type="password" class="form-control entrada-datos" placeholder="Repite la contraseña">
              </div>
            </div>

            <div class="d-flex justify-content-end gap-3 pt-2">
              <a href="06_perfil.html" class="btn btn-gris">Cancelar</a>
              <button type="submit" class="btn btn-rosa">Guardar cambios</button>
            </div>

      </form>
    </div>
  </div>
  </div>

</main>
